name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '24 8 * * 0'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: windows-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    
    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp' ]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Install NASM so the runner can assemble your clear_memory.asm file
    - name: Install NASM
      run: |
        choco install nasm -y
        echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        queries: security-extended, security-and-quality

    # Build explicitly by linking both the object files directly 
    - name: Compile Windows Project
      run: |
        nasm -f win64 clear_memory.asm -o clear_memory.o
        gcc -g custom_sanitizer.c clear_memory.o -o custom_sanitizer.exe -lpsapi

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{ matrix.language }}"
