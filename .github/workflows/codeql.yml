name: "CodeQL Analysis"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '30 18 * * 4' # Runs every Thursday at 18:30 UTC

jobs:
  analyze:
    name: Analyze C Project
    runs-on: windows-latest # Use windows-latest since you are utilizing Win32 APIs
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp' ] # CodeQL groups C and C++ under 'cpp'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Initializes the CodeQL tools for scanning
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        queries: security-extended, security-and-quality # Uses extended rulesets for SEI CERT

    # BUILD STEP: This is where CodeQL watches your compiler.
    # If using a makefile or a build bash script, replace these lines with your script commands.
    - name: Compile C Project
      run: |
        gcc custom_sanitizer.c -o custom_sanitizer.exe -lpsapi

    # Performs the actual semantic analysis queries
    - name: Perform CodeQL Analysis
      uses: github/github-codeql-action/analyze@v3
